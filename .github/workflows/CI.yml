# ゼミ用の簡略 CI。オーナー本番設定の参考: https://github.com/yamanori99/DistSSHRun.jl
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# DistSSHRun.jl と同様: PR では新しい push で古いランをキャンセル、main は走り切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  runic:
    name: Runic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: fredrikekre/runic-action@v1
        with:
          version: "1"

  test:
    name: JuliaGithubIntro2026 (${{ matrix.version }}, ${{ matrix.os }})
    needs: runic
    if: needs.runic.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
        os:
          - ubuntu-latest
        include:
          - os: macos-latest
            version: "1"
          - os: windows-latest
            version: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
