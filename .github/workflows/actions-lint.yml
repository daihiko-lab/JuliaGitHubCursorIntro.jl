# 教材用。DistSSHRun.jl の actions-lint.yml から actionlint のみ簡略化。
name: Actions lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$tool_dir"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$tool_dir"
          "$tool_dir/actionlint" -version
          "$tool_dir/actionlint"
